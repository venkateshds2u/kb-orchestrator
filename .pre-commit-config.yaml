repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - structlog>=24.4
          - httpx>=0.27
          - aiosqlite>=0.20.0
          - starlette>=1.0
          - uvicorn>=0.34
        args: [--strict]
        files: ^src/
